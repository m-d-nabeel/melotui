[package]
name = "melotui-db"
version = "0.2.0"
authors = ["m-d-nabeel"]
repository = "https://github.com/m-d-nabeel/melotui"
edition = "2024"

[dependencies]
melotui-core = { path = "../melotui-core" }
melotui-ipc = { path = "../melotui-ipc" }
rusqlite = { version = "0.38", features = ["bundled", "time"] }
anyhow = "1"
tracing = "0.1"
lofty = "0.22"
dirs = "6"

[dev-dependencies]
mockall = "0.14.0"
