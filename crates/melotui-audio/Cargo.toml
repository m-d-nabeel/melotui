[package]
name = "melotui-audio"
version = "0.5.0"
authors = ["m-d-nabeel"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/m-d-nabeel/melotui"
edition = "2024"

[dependencies]
melotui-core = { path = "../melotui-core" }
melotui-bus = { path = "../melotui-bus" }
rodio = { version = "0.21", default-features = false, features = [
  "symphonia-all",
  "playback",
] }
tracing = "0.1"
spectrum-analyzer = "1.7"
ringbuf = "0.5"
anyhow = "1"
fundsp = "0.20"

# Pulled in directly (not via rodio) purely to switch on cpal's optional
# `audio_thread_priority` dependency. Without it cpal compiles a no-op stub and
# the thread that runs our decoder + DSP graph stays SCHED_OTHER, which is what
# caused dropouts whenever another app competed for CPU. With it, the thread is
# promoted to SCHED_RR via RTKit (no limits.conf change needed).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cpal = { version = "0.16", features = ["audio_thread_priority"] }

