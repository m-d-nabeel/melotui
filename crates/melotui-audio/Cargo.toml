[package]
name = "melotui-audio"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
melotui-core.workspace = true
melotui-bus.workspace = true
rodio = { version = "0.23", default-features = false, features = [
  "symphonia-all",
  "playback",
] }
tracing = "0.1"
spectrum-analyzer = "1.7"
ringbuf = "0.5"
anyhow = "1"
serde_json = "1"
fundsp = "0.20"

# Pulled in directly (not via rodio) purely to switch on cpal's optional
# `audio_thread_priority` dependency. Without it cpal compiles a no-op stub and
# the thread that runs our decoder + DSP graph stays SCHED_OTHER, which is what
# caused dropouts whenever another app competed for CPU. With it, the thread is
# promoted to SCHED_RR via RTKit (no limits.conf change needed).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cpal = { version = "0.18", features = ["realtime"] }


[dev-dependencies]
tempfile = "3.12"
