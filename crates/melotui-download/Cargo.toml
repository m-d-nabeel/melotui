[package]
name = "melotui-download"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
melotui-core.workspace = true
melotui-bus.workspace = true
tracing = "0.1"
ureq = { version = "3", features = ["json"] }
serde_json = "1.0"
lofty = "0.25"


# To stop a download's whole family of processes, not yt-dlp alone: safe
# wrappers for signals, the same crate and feature ctrlc already builds.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3.12"
