[package]
name = "melotui-tui"
version = "0.4.0"
authors = ["m-d-nabeel"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/m-d-nabeel/melotui"
edition = "2024"

[features]
default = ["images-basic"]
images-basic = ["ratatui-image/crossterm"]
images-chafa = ["images-basic", "ratatui-image/chafa-dyn"]

[dependencies]
anyhow = "1"
ratatui = "0.30"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
melotui-core = { path = "../melotui-core" }
ratatui-image = { version = "10.0.4", default-features = false }
image = "0.25"
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-bidi = "0.3"
ar-reshaper = "1.5"
cosmic-text = "0.19"
tui-input = { version = "0.15.3", features = ["ratatui-crossterm"] }
toml = "1.1.2"

