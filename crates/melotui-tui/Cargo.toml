[package]
name = "melotui-tui"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[features]
default = ["images-basic"]
images-basic = ["ratatui-image/crossterm"]
images-chafa = ["images-basic", "ratatui-image/chafa-dyn"]

[dependencies]
anyhow = "1"
ratatui = "0.30"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
melotui-core.workspace = true
ratatui-image = { version = "11.1.0", default-features = false }
image.workspace = true
unicode-width = "0.2"
unicode-segmentation = "1"
base64 = "0.23"
terminal-colorsaurus = "1.0"
unicode-bidi = "0.3"
ar-reshaper = "1.5"
cosmic-text = "0.19"
tui-input = { version = "0.15.3", features = ["ratatui-crossterm"] }
toml = "1.1.2"

