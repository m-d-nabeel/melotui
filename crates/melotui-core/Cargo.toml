[package]
name = "melotui-core"
version = "0.2.0"
authors = ["m-d-nabeel"]
repository = "https://github.com/m-d-nabeel/melotui"
edition = "2024"

[dependencies]
anyhow = "1"
lofty = "0.22"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6"
image = "0.25"
rand = "0.9"
tui-input = { version = "0.15.3", default-features = false }
lrc = "0.1.8"

[dev-dependencies]
mockall = "0.14.0"
