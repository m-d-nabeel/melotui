[package]
name = "melotui"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A terminal music player with a spectrum visualizer, DSP effects, synced lyrics and YouTube downloads"
readme = "../../README.md"
keywords = ["music", "player", "tui", "audio", "terminal"]
categories = ["multimedia::audio", "command-line-utilities"]
edition.workspace = true

# Where `cargo binstall` finds the prebuilt binaries: the archives the
# release workflow attaches to each GitHub release, which hold the binary
# alone at their root.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/melotui-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/melotui-macos-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/melotui-macos-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/melotui-windows-x86_64.zip"
pkg-fmt = "zip"

[dependencies]
clap = { version = "4", features = ["derive"] }
melotui-core.workspace = true
melotui-tui.workspace = true
melotui-bus.workspace = true
melotui-engine.workspace = true

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
dirs = "6"
anyhow = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
souvlaki = "0.8"
