name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to publish, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    steps:
      - name: Require semver tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3, optionally with prerelease/build metadata."
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cargo_bin_name: melotui
            final_bin_name: melotui
            asset_name: melotui-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_bin_name: melotui.exe
            final_bin_name: melotui.exe
            asset_name: melotui-windows-x86_64.zip
          - os: macos-14
            target: x86_64-apple-darwin
            cargo_bin_name: melotui
            final_bin_name: melotui
            asset_name: melotui-macos-x86_64.tar.gz
            deployment_target: "10.15"
          - os: macos-latest
            target: aarch64-apple-darwin
            cargo_bin_name: melotui
            final_bin_name: melotui
            asset_name: melotui-macos-aarch64.tar.gz
            deployment_target: "11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, for stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: cargo build --profile production --bin melotui --target ${{ matrix.target }} --locked

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/production/${{ matrix.cargo_bin_name }} dist/${{ matrix.final_bin_name }}
          strip dist/${{ matrix.final_bin_name }} || true
          tar -C dist -czf ${{ matrix.asset_name }} ${{ matrix.final_bin_name }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\${{ matrix.target }}\production\${{ matrix.cargo_bin_name }} dist\${{ matrix.final_bin_name }}
          Compress-Archive -Path dist\${{ matrix.final_bin_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
