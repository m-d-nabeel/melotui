name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to publish, for example v2026.11.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Require a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must look like v2026.11.0: three numbers, none with a leading zero."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # A tag put on the commit before the version was changed would
      # release archives that say they are the version before.
      - name: Require the tag to be the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "melotui") | .version')
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "The tag is $RELEASE_TAG, and Cargo.toml says the version is $version."
            exit 1
          fi

      - name: Require the tagged commit to be on master
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "$RELEASE_TAG is not on master."
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cargo_bin_name: melotui
            final_bin_name: melotui
            asset_name: melotui-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_bin_name: melotui.exe
            final_bin_name: melotui.exe
            asset_name: melotui-windows-x86_64.zip
          # Built for Intel on an Apple Silicon runner, as the one above
          # the next is built for itself: the runner CI tests on, so a
          # runner that is retired fails there before it fails a release.
          - os: macos-latest
            target: x86_64-apple-darwin
            cargo_bin_name: melotui
            final_bin_name: melotui
            asset_name: melotui-macos-x86_64.tar.gz
            deployment_target: "10.15"
          - os: macos-latest
            target: aarch64-apple-darwin
            cargo_bin_name: melotui
            final_bin_name: melotui
            asset_name: melotui-macos-aarch64.tar.gz
            deployment_target: "11.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, for stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.target }}

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: cargo build --release --bin melotui --target ${{ matrix.target }} --locked

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.cargo_bin_name }} dist/${{ matrix.final_bin_name }}
          strip dist/${{ matrix.final_bin_name }} || true
          tar -C dist -czf ${{ matrix.asset_name }} ${{ matrix.final_bin_name }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\${{ matrix.target }}\release\${{ matrix.cargo_bin_name }} dist\${{ matrix.final_bin_name }}
          Compress-Archive -Path dist\${{ matrix.final_bin_name }} -DestinationPath ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # For checking a download: `sha256sum -c SHA256SUMS --ignore-missing`.
      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
