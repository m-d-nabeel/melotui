[workspace]
resolver = "3"
members = [
  "crates/melotui-core",
  "crates/melotui-tui",
  "crates/melotui-audio",
  "crates/melotui-bus",
  "crates/melotui-bin",
  "crates/melotui-download",
  "crates/melotui-db",
  "crates/melotui-cover",
  "crates/melotui-engine",
]

[workspace.package]
version = "0.6.1"
authors = ["m-d-nabeel"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/m-d-nabeel/melotui"
edition = "2024"
# The oldest Rust this builds with: what the newest of its dependencies ask
# for. CI builds with exactly this version, so raising it is a decision made
# here, not something a dependency update does unnoticed.
rust-version = "1.90"

# The workspace's own crates, and dependencies several of them share.
[workspace.dependencies]
melotui-core = { path = "crates/melotui-core", version = "0.6.1" }
melotui-bus = { path = "crates/melotui-bus", version = "0.6.1" }
melotui-audio = { path = "crates/melotui-audio", version = "0.6.1" }
melotui-db = { path = "crates/melotui-db", version = "0.6.1" }
melotui-cover = { path = "crates/melotui-cover", version = "0.6.1" }
melotui-download = { path = "crates/melotui-download", version = "0.6.1" }
melotui-engine = { path = "crates/melotui-engine", version = "0.6.1" }
melotui-tui = { path = "crates/melotui-tui", version = "0.6.1" }
# Only the formats melotui reads cover art in, and writes its images as:
# the default set also builds an AVIF encoder that nothing here uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "rayon"] }

[profile.production]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Unwinding, as in the other profiles: the panics that are caught — a tag
# library failing on one file — could not be under "abort", and a release
# archive would then behave differently from a `cargo install`. A panic
# nobody catches still ends the process, from the panic hook in `main`.
overflow-checks = false
incremental = false

# The effects' tests push seconds of audio through the DSP graph, and
# unoptimised that took half a minute of every test run. The crates doing the
# arithmetic are built optimised in development too; melotui's own stay as
# they are, quick to build and to step through.
[profile.dev.package.fundsp]
opt-level = 3
[profile.dev.package.melotui-audio]
opt-level = 2
