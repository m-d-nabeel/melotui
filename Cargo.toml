[workspace]
resolver = "3"
members = [
  "crates/melotui-core",
  "crates/melotui-tui",
  "crates/melotui-audio",
  "crates/melotui-bus",
  "crates/melotui-bin",
  "crates/melotui-download",
  "crates/melotui-db",
  "crates/melotui-cover",
  "crates/melotui-engine",
]

[workspace.package]
version = "0.5.0"
authors = ["m-d-nabeel"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/m-d-nabeel/melotui"
edition = "2024"

# The workspace's own crates, and dependencies several of them share.
[workspace.dependencies]
melotui-core = { path = "crates/melotui-core", version = "0.5.0" }
melotui-bus = { path = "crates/melotui-bus", version = "0.5.0" }
melotui-audio = { path = "crates/melotui-audio", version = "0.5.0" }
melotui-db = { path = "crates/melotui-db", version = "0.5.0" }
melotui-cover = { path = "crates/melotui-cover", version = "0.5.0" }
melotui-download = { path = "crates/melotui-download", version = "0.5.0" }
melotui-engine = { path = "crates/melotui-engine", version = "0.5.0" }
melotui-tui = { path = "crates/melotui-tui", version = "0.5.0" }
# Only the formats melotui reads cover art in, and writes its images as:
# the default set also builds an AVIF encoder that nothing here uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "rayon"] }

[profile.production]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
incremental = false
