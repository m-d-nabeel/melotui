[workspace]
resolver = "3"
members = [
  "crates/melotui-core",
  "crates/melotui-tui",
  "crates/melotui-audio",
  "crates/melotui-bus",
  "crates/melotui-bin",
  "crates/melotui-download",
  "crates/melotui-db",
  "crates/melotui-cover",
  "crates/melotui-engine",
]

[workspace.package]
version = "2026.11.2"
authors = ["m-d-nabeel"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/m-d-nabeel/melotui"
edition = "2024"
# The oldest Rust this builds with: what the newest of its dependencies ask
# for. CI builds with exactly this version, so raising it is a decision made
# here, not something a dependency update does unnoticed.
rust-version = "1.90"

# The workspace's own crates, and dependencies several of them share. The
# workspace's crates are pinned to the exact version: published, a plain
# "2026.11.1" would let an older melotui be built with newer crates of its own,
# from a later release, which it was never built with.
[workspace.dependencies]
melotui-core = { path = "crates/melotui-core", version = "=2026.11.2" }
melotui-bus = { path = "crates/melotui-bus", version = "=2026.11.2" }
melotui-audio = { path = "crates/melotui-audio", version = "=2026.11.2" }
melotui-db = { path = "crates/melotui-db", version = "=2026.11.2" }
melotui-cover = { path = "crates/melotui-cover", version = "=2026.11.2" }
melotui-download = { path = "crates/melotui-download", version = "=2026.11.2" }
melotui-engine = { path = "crates/melotui-engine", version = "=2026.11.2" }
melotui-tui = { path = "crates/melotui-tui", version = "=2026.11.2" }
# Only the formats melotui reads cover art in, and writes its images as:
# the default set also builds an AVIF encoder that nothing here uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "rayon"] }

# Lints beyond clippy's defaults that the code keeps to; CI's clippy treats
# every warning as an error, so they stay kept. Chosen from clippy's pedantic
# and nursery groups for catching real waste or mistakes (a clone not needed,
# a value built though unused, a match that would swallow a variant added
# later) or for reading plainly (`format!("{x}")`, let-else). Left out on
# purpose: `use_self`, `unreadable_literal`, the casts, `missing_const_for_fn`,
# `must_use_candidate` and `suboptimal_flops` — thousands of changes of taste
# in DSP code, or `mul_add`, slower without FMA hardware.
[workspace.lints.clippy]
assigning_clones = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
equatable_if_let = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
if_not_else = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
manual_let_else = "warn"
manual_midpoint = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_wildcard_for_single_variants = "warn"
needless_collect = "warn"
needless_for_each = "warn"
needless_raw_string_hashes = "warn"
or_fun_call = "warn"
redundant_clone = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unchecked_time_subtraction = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnecessary_debug_formatting = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

# What the release downloads are built with, as everyone else builds it:
# `cargo build --release`. Stripped, the binary is 22 MB instead of 27; a panic
# still says where it happened. Fat LTO and one codegen unit, measured on
# 2026-11-17, played no lighter (3.2% of a core either way, with the
# visualizer and an effect on) and made the download 0.9 MB smaller, at five
# times the rebuild: not kept. Panics unwind, as cargo's default: the ones
# that are caught (a tag library failing on one file) could not be caught
# under "abort". One nobody catches still ends the process, from the panic
# hook in `main`.
[profile.release]
strip = true

# The effects' tests push seconds of audio through the DSP graph, and
# unoptimised that took half a minute of every test run. The crates doing the
# arithmetic are built optimised in development too; melotui's own stay as
# they are, quick to build and to step through.
[profile.dev.package.fundsp]
opt-level = 3
[profile.dev.package.melotui-audio]
opt-level = 2
# Opus is decoded as it is played, and unoptimized its decoder is slow.
[profile.dev.package.opus-rs]
opt-level = 3
