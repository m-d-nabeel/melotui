[workspace]
resolver = "3"
members = [
    "crates/melotui-core",
    "crates/melotui-tui",
    "crates/melotui-audio",
    "crates/melotui-ipc",
    "crates/melotui-bin", 
    "crates/melotui-download",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
incremental = false
